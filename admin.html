<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com; img-src 'self' blob:; media-src 'self' blob:">
<title>Manage Samples</title>
<style>
:root{--ink:#111;--ground:#F5F3EE;--accent:#FF7A45;--muted:#444;--line:#E4E1D8}
*{box-sizing:border-box}
[hidden]{display:none!important}
#manager{display:flex;flex-direction:column;gap:20px}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--ground);line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:32px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:32px;line-height:1.1}
h2{margin:0;font-size:20px}
p{margin:0;color:var(--muted)}
.card{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
input{width:100%;min-height:44px;padding:10px 12px;font:inherit;font-weight:400;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:inherit}
.btn{align-self:flex-start;min-height:44px;padding:10px 20px;font:inherit;font-weight:600;border:1.5px solid var(--ink);border-radius:999px;background:transparent;color:inherit;cursor:pointer}
.btn-accent{background:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px}
.item{display:flex;flex-wrap:wrap;gap:16px;padding-top:16px;border-top:1.5px solid var(--line)}
.item img,.item .none{width:96px;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:#111;flex:none}
.item .fields{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:10px}
.note{font-size:14px;padding:12px 14px;border-radius:12px;background:var(--ground)}
#status{position:sticky;bottom:12px;padding:12px 16px;border-radius:12px;background:var(--ink);color:#fff}
#status.error{background:#B3261E}
</style>
</head>
<body>
<div class="wrap">
  <h1>Manage samples</h1>

  <form class="card" id="connect">
    <h2>Connect to GitHub</h2>
    <p>Paste your GitHub access token. It is saved only in this browser.</p>
    <label>Access token <input id="token" type="password" autocomplete="off" required></label>
    <div class="row">
      <button class="btn btn-accent" type="submit">Connect</button>
      <button class="btn" type="button" id="forget">Forget token</button>
    </div>
  </form>

  <div id="manager" hidden>
    <form class="card" id="add">
      <h2>Add a video or image</h2>
      <p class="note">Only add files and text you're allowed to show. No client names or other brands, except Daiichi Technologies.</p>
      <label>Video (MP4 or WebM, up to 50 MB) or image (JPG, PNG or WebP, up to 10 MB) <input id="file" type="file" accept=".mp4,.webm,.jpg,.jpeg,.png,.webp,video/mp4,video/webm,image/jpeg,image/png,image/webp" required></label>
      <label>Title <input id="title" required maxlength="80"></label>
      <label>Label (optional) <input id="badge" maxlength="30" placeholder="AI Video Ad"></label>
      <label>Short description (optional) <input id="description" maxlength="120"></label>
      <button class="btn btn-accent" type="submit">Upload and publish</button>
    </form>

    <div class="card">
      <h2>Samples on your site</h2>
      <div id="list"></div>
      <button class="btn btn-accent" id="save" type="button">Save changes</button>
    </div>
  </div>

  <div id="status" hidden role="status"></div>
</div>

<script>
var REPO = 'naeemdev8-dev/Naeem';
var BRANCH = 'main';
var MAX_BYTES = 50 * 1024 * 1024;
var MAX_IMAGE_BYTES = 10 * 1024 * 1024;
var IMAGE_EXT = /\.(jpe?g|png|webp)$/i;
var token = '';
var videos = [];
var $ = function(id){ return document.getElementById(id); };

function setStatus(text, isError){
  $('status').hidden = !text;
  $('status').textContent = text || '';
  $('status').className = isError ? 'error' : '';
}

// localStorage can be blocked, so the token may need pasting again
function store(value){
  try {
    if(value) localStorage.setItem('gh-token', value);
    else localStorage.removeItem('gh-token');
  } catch(e){}
}
function stored(){
  try { return localStorage.getItem('gh-token') || ''; } catch(e){ return ''; }
}

async function api(path, method, body){
  var r = await fetch('https://api.github.com/repos/' + REPO + '/' + path, {
    method: method || 'GET',
    cache: 'no-store',
    headers: {Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json'},
    body: body ? JSON.stringify(body) : undefined
  });
  if(r.status === 401) throw new Error('GitHub rejected this token. It may be wrong or expired.');
  if(r.status === 403 || r.status === 404) throw new Error('This token cannot change the repo. It needs Contents: Read and write on ' + REPO + '.');
  if(!r.ok) throw new Error('GitHub error ' + r.status + '. Nothing was published if this step failed. Please try again.');
  return r.json();
}

// Everything goes in one commit, so the video and the list always publish together
async function commit(message, adds, deletes){
  var head = (await api('git/ref/heads/' + BRANCH)).object.sha;
  var base = (await api('git/commits/' + head)).tree.sha;
  var tree = [];
  for(var a of adds){
    var blob = await api('git/blobs', 'POST', {content: a.content, encoding: a.encoding});
    tree.push({path: a.path, mode: '100644', type: 'blob', sha: blob.sha});
  }
  (deletes || []).forEach(function(path){
    tree.push({path: path, mode: '100644', type: 'blob', sha: null});
  });
  var newTree = await api('git/trees', 'POST', {base_tree: base, tree: tree});
  var newCommit = await api('git/commits', 'POST', {message: message, tree: newTree.sha, parents: [head]});
  await api('git/refs/heads/' + BRANCH, 'PATCH', {sha: newCommit.sha});
}

function listFile(list){
  return {path: 'videos.json', content: JSON.stringify(list, null, 2) + '\n', encoding: 'utf-8'};
}

async function load(){
  var res = await api('contents/videos.json?ref=' + BRANCH);
  var bytes = Uint8Array.from(atob(res.content.replace(/\n/g, '')), function(c){ return c.charCodeAt(0); });
  videos = JSON.parse(new TextDecoder().decode(bytes));
  render();
}

function toBase64(blob){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onload = function(){ resolve(fr.result.split(',')[1]); };
    fr.onerror = function(){ reject(new Error('Could not read that file.')); };
    fr.readAsDataURL(blob);
  });
}

// Takes a thumbnail from the video. Returns null if the browser can't decode it
function makePoster(file){
  return new Promise(function(resolve){
    var url = URL.createObjectURL(file);
    var v = document.createElement('video');
    var finish = function(result){
      clearTimeout(timer);
      URL.revokeObjectURL(url);
      resolve(result);
    };
    var timer = setTimeout(function(){ finish(null); }, 15000);
    v.muted = true;
    v.playsInline = true;
    v.onerror = function(){ finish(null); };
    v.onloadeddata = function(){ v.currentTime = Math.min(1, v.duration / 2) || 0; };
    v.onseeked = function(){
      var scale = Math.min(1, 540 / v.videoWidth);
      var c = document.createElement('canvas');
      c.width = Math.round(v.videoWidth * scale);
      c.height = Math.round(v.videoHeight * scale);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      c.toBlob(finish, 'image/jpeg', 0.85);
    };
    v.src = url;
  });
}

function field(labelText, key, item){
  var l = document.createElement('label');
  l.textContent = labelText;
  var i = document.createElement('input');
  i.value = item[key] || '';
  i.oninput = function(){ item[key] = i.value.trim(); };
  l.appendChild(i);
  return l;
}

function button(text, onClick, disabled){
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'btn';
  b.textContent = text;
  b.disabled = !!disabled;
  b.onclick = onClick;
  return b;
}

function move(index, by){
  var moved = videos.splice(index, 1)[0];
  videos.splice(index + by, 0, moved);
  render();
  setStatus('Order changed. Click Save changes to publish it.');
}

function render(){
  var list = $('list');
  list.textContent = '';
  if(!videos.length){
    var empty = document.createElement('p');
    empty.textContent = 'No samples yet.';
    list.appendChild(empty);
  }
  videos.forEach(function(item, index){
    var row = document.createElement('div');
    row.className = 'item';
    var thumbSrc = item.poster || (IMAGE_EXT.test(item.file) ? item.file : '');
    var thumb = document.createElement(thumbSrc ? 'img' : 'div');
    if(thumbSrc){ thumb.src = thumbSrc; thumb.alt = ''; }
    else thumb.className = 'none';
    var fields = document.createElement('div');
    fields.className = 'fields';
    fields.appendChild(field('Title', 'title', item));
    fields.appendChild(field('Label', 'badge', item));
    fields.appendChild(field('Description', 'description', item));
    var actions = document.createElement('div');
    actions.className = 'row';
    actions.appendChild(button('Move up', function(){ move(index, -1); }, index === 0));
    actions.appendChild(button('Move down', function(){ move(index, 1); }, index === videos.length - 1));
    actions.appendChild(button('Remove', function(){ remove(index); }));
    fields.appendChild(actions);
    row.appendChild(thumb);
    row.appendChild(fields);
    list.appendChild(row);
  });
}

// Runs a publish step with the buttons locked so it can't be sent twice
async function publish(work, doneText){
  var buttons = document.querySelectorAll('button');
  buttons.forEach(function(b){ b.dataset.was = b.disabled ? '1' : ''; b.disabled = true; });
  try {
    await work();
    setStatus(doneText);
    return true;
  } catch(e){
    setStatus(e.message, true);
    return false;
  } finally {
    buttons.forEach(function(b){ b.disabled = b.dataset.was === '1'; });
  }
}

var LIVE_SOON = 'Published. It should appear on your site within a few minutes.';

async function remove(index){
  var item = videos[index];
  if(!confirm('Remove "' + item.title + '" from your site?')) return;
  var next = videos.filter(function(v){ return v !== item; });
  // Only uploaded samples get deleted. Files in videos/ are also used by the top of the page
  var deletes = [item.file, item.poster].filter(function(p){ return p && p.indexOf('samples/') === 0; });
  var ok = await publish(function(){
    setStatus('Removing...');
    return commit('Remove sample', [listFile(next)], deletes);
  }, LIVE_SOON);
  if(ok){ videos = next; render(); }
}

$('save').onclick = function(){
  if(videos.some(function(v){ return !v.title; })){
    setStatus('Every sample needs a title.', true);
    return;
  }
  publish(function(){
    setStatus('Saving...');
    return commit('Update sample details', [listFile(videos)]);
  }, LIVE_SOON);
};

$('add').onsubmit = async function(e){
  e.preventDefault();
  var file = $('file').files[0];
  if(!file) return;
  var imageExt = file.name.match(IMAGE_EXT);
  if(!imageExt && !/\.(mp4|webm)$/i.test(file.name)){
    setStatus('Please choose an MP4 or WebM video, or a JPG, PNG or WebP image.', true);
    return;
  }
  if(file.size > (imageExt ? MAX_IMAGE_BYTES : MAX_BYTES)){
    setStatus('That file is over ' + (imageExt ? '10' : '50') + ' MB. Please compress it and try again.', true);
    return;
  }
  // A generated name keeps the original file name, which may name a client, out of the public repo
  var id = 'sample-' + Date.now();
  var ext = imageExt ? imageExt[0].toLowerCase() : (/\.webm$/i.test(file.name) ? '.webm' : '.mp4');
  var item = {file: 'samples/' + id + ext, badge: $('badge').value.trim(), title: $('title').value.trim(), description: $('description').value.trim()};
  var ok = await publish(async function(){
    var poster = null;
    if(!imageExt){
      setStatus('Making thumbnail...');
      poster = await makePoster(file);
    }
    setStatus('Uploading. Keep this page open...');
    var adds = [{path: item.file, content: await toBase64(file), encoding: 'base64'}];
    if(poster){
      item.poster = 'samples/' + id + '.jpg';
      adds.push({path: item.poster, content: await toBase64(poster), encoding: 'base64'});
    }
    adds.push(listFile(videos.concat(item)));
    await commit('Add sample', adds);
  }, LIVE_SOON);
  if(ok){
    videos.push(item);
    render();
    $('add').reset();
  }
};

async function connect(value){
  token = value;
  setStatus('Connecting...');
  try {
    await load();
    store(token);
    $('connect').hidden = true;
    $('manager').hidden = false;
    setStatus('');
  } catch(e){
    setStatus(e.message, true);
  }
}

$('connect').onsubmit = function(e){
  e.preventDefault();
  connect($('token').value.trim());
};
$('forget').onclick = function(){
  store('');
  token = '';
  $('token').value = '';
  setStatus('Token forgotten on this browser.');
};

if(stored()) connect(stored());
</script>
</body>
</html>
